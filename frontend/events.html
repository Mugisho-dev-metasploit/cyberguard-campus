<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Events | CYBERGUARD CAMPUS</title>
    <meta name="description" content="CYBERGUARD CAMPUS security event trail." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="assets/img/brand/favicon.png" />
    <link rel="preload" href="assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/ibm-plex-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/navigation.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages/events.css" />
    <script type="module" src="assets/js/app.js"></script>
    <script type="module" src="assets/js/pages/events.js"></script>
  </head>
  <body data-page="events">
    <div id="app-shell"></div>

    <main id="main-content" tabindex="-1">
      <div class="events-page">
        <header class="page-header">
          <div class="page-header-text">
            <p class="eyebrow">Security Operations</p>
            <h1>Security Events</h1>
            <p class="page-subtitle">Security event trail recorded by CYBERGUARD CAMPUS</p>
          </div>
        </header>

        <p class="visually-hidden" id="events-announcer" role="status" aria-live="polite"></p>

        <section class="panel chart-panel events-volume" aria-labelledby="volume-title">
          <div class="chart-panel-head">
            <h2 class="chart-panel-title" id="volume-title">Event volume</h2>
            <p class="section-caption">Events recorded per day over the last 14 days</p>
          </div>
          <div id="events-volume" aria-busy="true"></div>
        </section>

        <section class="panel" aria-labelledby="events-title">
          <header class="panel-header">
            <div class="panel-heading">
              <h2 class="panel-title" id="events-title">Event Trail</h2>
              <p class="panel-subtitle">Events returned by the API, newest first</p>
            </div>
            <span class="count-pill" id="events-count">—</span>
          </header>

          <div class="table-scroll">
            <table class="table events-table" aria-labelledby="events-title">
              <thead>
                <tr>
                  <th scope="col">Timestamp</th>
                  <th scope="col">Severity</th>
                  <th scope="col">Source</th>
                  <th scope="col">Event Type</th>
                  <th scope="col">Category</th>
                  <th scope="col">Source IP</th>
                  <th scope="col">Destination</th>
                  <th scope="col">Protocol</th>
                  <th scope="col">Signature</th>
                </tr>
              </thead>
              <tbody id="events-table-body" aria-busy="true"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
